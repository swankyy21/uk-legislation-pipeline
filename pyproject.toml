[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uk-legislation-pipeline"
version = "0.1.0"
description = "Deterministic CLML extraction pipeline for legislation.gov.uk XML."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
uk-legislation-extract = "legislation_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
